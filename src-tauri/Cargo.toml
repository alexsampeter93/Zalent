[package]
name = "zalent"
version = "0.1.0"
description = "Zalent - gestor de CVs y talento local-first con IA"
authors = ["Alejandro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zalent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
argon2 = "0.5"
getrandom = "0.2"
aes-gcm = "0.10"
# Cliente HTTP para hablar con Ollama en localhost. `default-features = false`
# quita el TLS a propósito: solo llamamos a http://127.0.0.1, no necesitamos
# cifrado de transporte, y así NO arrastra OpenSSL (que es lo que nos tumbó
# el intento de SQLCipher en esta máquina: compilarlo pedía Strawberry Perl).
reqwest = { version = "0.12", default-features = false, features = ["json"] }

