[package]
name = "zalent"
version = "0.1.0"
description = "Zalent - gestor de CVs y talento local-first con IA"
authors = ["Alejandro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zalent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Perfil de RELEASE. Sin esto, el .exe salía con 162 MB: Cargo por defecto
# mete los símbolos de depuración y no optimiza el tamaño. Importa más de lo
# que parece: el CAB de un instalador MSI tiene un techo DURO de 2 GB, y con
# el modelo empotrado (1,8 GB) nos pasábamos por apenas 20 MB.
[profile.release]
strip = true      # fuera símbolos de depuración (el grueso de los 162 MB)
lto = true        # optimización entre módulos: menos código duplicado
opt-level = "s"   # optimizar para TAMAÑO, no para velocidad bruta
codegen-units = 1 # menos paralelismo al compilar, pero mejor optimización
panic = "abort"   # sin código de desenrollado de pila (no lo usamos)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
argon2 = "0.5"
getrandom = "0.2"
aes-gcm = "0.10"
# Cliente HTTP para hablar con Ollama en localhost. `default-features = false`
# quita el TLS a propósito: solo llamamos a http://127.0.0.1, no necesitamos
# cifrado de transporte, y así NO arrastra OpenSSL (que es lo que nos tumbó
# el intento de SQLCipher en esta máquina: compilarlo pedía Strawberry Perl).
reqwest = { version = "0.12", default-features = false, features = ["json"] }

