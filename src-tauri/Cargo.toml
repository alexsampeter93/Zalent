[package]
name = "zalent"
version = "0.1.0"
description = "Zalent - gestor de CVs y talento local-first con IA"
authors = ["Alejandro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zalent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Perfil de RELEASE. Sin esto, el .exe salía con 162 MB: Cargo por defecto
# mete los símbolos de depuración y no optimiza el tamaño. Importa más de lo
# que parece: el CAB de un instalador MSI tiene un techo DURO de 2 GB, y con
# el modelo empotrado (1,8 GB) nos pasábamos por apenas 20 MB.
[profile.release]
strip = true      # fuera símbolos de depuración (el grueso de los 162 MB)
lto = true        # optimización entre módulos: menos código duplicado
opt-level = "s"   # optimizar para TAMAÑO, no para velocidad bruta
codegen-units = 1 # menos paralelismo al compilar, pero mejor optimización
panic = "abort"   # sin código de desenrollado de pila (no lo usamos)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fork local (solo SQLite) del plugin oficial, para poder cifrar la BD con
# SQLCipher -- tauri-plugin-sql no lo soporta. Aplica `PRAGMA key` al conectar,
# con la clave derivada de la contraseña maestra (Argon2). La migración es
# reversible y verificada. Ver src-tauri/vendor/ y Diario, entradas 39-42.
tauri-plugin-sql = { path = "vendor/tauri-plugin-sql-cipher" }
argon2 = "0.5"
getrandom = "0.2"
aes-gcm = "0.10"
# Borrado seguro de la clave de sesión en memoria (que no quede en un volcado
# de RAM tras bloquear o quitar la contraseña). Ver S2 en PENDIENTES.
zeroize = "1"
# Solo para la MIGRACIÓN de la BD a cifrado (encrypt_database): necesita abrir
# SQLite directamente para el `sqlcipher_export`. Es el mismo sqlx que ya usa
# el plugin por debajo, así que no añade tiempo de compilación real.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
# Cliente HTTP para hablar con Ollama en localhost. `default-features = false`
# quita el TLS a propósito: solo llamamos a http://127.0.0.1, no necesitamos
# cifrado de transporte, y así NO arrastra OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

