<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zalent</title>
  </head>

  <body>
    <!-- Telón previo: entre que se abre la ventana y React pinta el splash hay
         unos fotogramas en los que, sin esto, se vería el fondo en blanco.
         Lleva el MISMO degradado que `BrandSplash`, así que el relevo es
         invisible. React lo borra al renderizar dentro de #root. -->
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          background: linear-gradient(215deg, #fdebd6 0%, #f8dab8 48%, #efcca8 100%);
        "
      ></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
